<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 210" width="160" height="210" role="img" aria-label="Astra, the ShadowAstra field-test astronaut, waving">
  <defs>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2742"/><stop offset="1" stop-color="#090c16"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f0ea"/><stop offset="1" stop-color="#cfcac0"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    * { transform-box: view-box; }
    .body { transform-origin: 80px 190px; animation: float 4.2s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .shadow { transform-origin: 80px 196px; animation: sh 4.2s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .armL { transform-origin: 57px 90px; transform: rotate(10deg); }
    .armR { transform-origin: 103px 90px; animation: wave 1.6s cubic-bezier(.45,0,.55,1) infinite; }
    .eyes { transform-origin: 80px 56px; animation: blink 5s infinite; }
    .led { animation: led 2.4s steps(1) infinite; } .l2 { animation-delay: .8s; } .l3 { animation-delay: 1.6s; }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    @keyframes sh { from { transform: scaleX(1); opacity: .45; } to { transform: scaleX(.85); opacity: .28; } }
    @keyframes wave { 0%,100% { transform: rotate(-150deg); } 50% { transform: rotate(-118deg); } }
    @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @keyframes led { 0%,60% { opacity: 1; } 61%,100% { opacity: .25; } }
  </style>
  <ellipse class="shadow" cx="80" cy="196" rx="30" ry="3.6" fill="#000"/>
  <g class="body">
    <rect x="50" y="76" width="60" height="58" rx="12" fill="#bdb7ac" stroke="#2f3035" stroke-width="1.4"/>
    <rect x="62" y="124" width="16" height="44" rx="7" fill="url(#suit)" stroke="#2f3035" stroke-width="1.4"/>
    <rect x="58" y="162" width="22" height="13" rx="6" fill="#8d887e" stroke="#2f3035" stroke-width="1.4"/>
    <rect x="82" y="124" width="16" height="44" rx="7" fill="url(#suit)" stroke="#2f3035" stroke-width="1.4"/>
    <rect x="80" y="162" width="22" height="13" rx="6" fill="#8d887e" stroke="#2f3035" stroke-width="1.4"/>
    <g class="armL">
      <rect x="50" y="86" width="14" height="42" rx="7" fill="url(#suit)" stroke="#2f3035" stroke-width="1.4"/>
      <circle cx="57" cy="131" r="6.5" fill="#8d887e" stroke="#2f3035" stroke-width="1.4"/>
    </g>
    <g class="armR">
      <rect x="96" y="86" width="14" height="42" rx="7" fill="url(#suit)" stroke="#2f3035" stroke-width="1.4"/>
      <circle cx="103" cy="131" r="6.5" fill="#8d887e" stroke="#2f3035" stroke-width="1.4"/>
    </g>
    <rect x="56" y="80" width="48" height="52" rx="16" fill="url(#suit)" stroke="#2f3035" stroke-width="1.4"/>
    <rect x="67" y="95" width="26" height="17" rx="4" fill="#16171b" stroke="#2f3035"/>
    <circle class="led" cx="73" cy="103.5" r="2" fill="#f2c879"/>
    <circle class="led l2" cx="80" cy="103.5" r="2" fill="#8fb4ea"/>
    <circle class="led l3" cx="87" cy="103.5" r="2" fill="#7cc8a0"/>
    <line x1="58" y1="120" x2="102" y2="120" stroke="#b3ada2" stroke-width="1.2"/>
    <circle cx="80" cy="56" r="30" fill="url(#suit)" stroke="#2f3035" stroke-width="1.5"/>
    <rect x="106" y="46" width="6" height="16" rx="3" fill="#bdb7ac" stroke="#2f3035" stroke-width="1.2"/>
    <circle cx="62" cy="34" r="2.2" fill="#f2c879"/>
    <rect x="57" y="40" width="46" height="32" rx="15" fill="url(#visor)" stroke="#2f3035" stroke-width="1.4"/>
    <path d="M63 47 Q70 42 80 42" stroke="#fff" stroke-opacity=".28" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g stroke="#f2c879" fill="none" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)">
      <g class="eyes"><path d="M67 57 Q71 52 75 57"/><path d="M85 57 Q89 52 93 57"/></g>
      <path d="M72 62 Q80 69 88 62"/>
    </g>
  </g>
</svg>
