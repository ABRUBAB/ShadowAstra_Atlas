<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020306" />
    <meta name="description" content="ShadowAstra Atlas: find the Earth landscapes where crews, rovers and instruments can rehearse permanent Moon base and Mars missions. NASA Space Apps Challenge 2026 · Dhaka." />
    <meta property="og:title" content="ShadowAstra Atlas" />
    <meta property="og:description" content="ShadowAstra Atlas: find the Earth landscapes where crews, rovers and instruments can rehearse permanent Moon base and Mars missions. NASA Space Apps Challenge 2026 · Dhaka." />
    <link rel="icon" type="image/jpeg" href="/brand/shadowastra-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Michroma&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      try {
        var q = new URLSearchParams(location.search).get("theme");
        if (q === "light" || q === "dark") localStorage.setItem("sa-theme", q);
        if (localStorage.getItem("sa-theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <title>ShadowAstra Atlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
